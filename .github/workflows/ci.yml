name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Laravel, MySQL 8.4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: jb_hotel_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, bcmath, intl, zip, gd
          coverage: none
          # JIT désactivé : erreur « CarbonImmutable given » apparue sous JIT sur le serveur de recette (20/11/2026).
          ini-values: opcache.jit=disable, opcache.jit_buffer_size=0
        env:
          # Téléchargements GitHub authentifiés : évite la limite anonyme (HTTP 429).
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dossier du cache Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Préparer l'environnement
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Format (Pint)
        run: vendor/bin/pint --test

      - name: Analyse statique (Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Tests
        run: php artisan test

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer le navigateur E2E
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Parcours navigateur et accessibilité (base isolée)
        working-directory: frontend
        env:
          APP_ENV: local
          DB_DATABASE: jb_hotel_test
        run: npm run test:e2e

      # Les journaux d'exécution exigent les droits d'administrateur du dépôt ; les annotations,
      # elles, sont publiques : on y publie les dernières erreurs serveur en cas d'échec.
      - name: Erreurs serveur en annotations (échec)
        if: failure()
        run: |
          if [ -f storage/logs/laravel.log ]; then
            grep -E '\] local\.(ERROR|CRITICAL|ALERT|EMERGENCY):' storage/logs/laravel.log | tail -n 8 | while IFS= read -r line; do
              echo "::warning title=laravel.log::${line:0:900}"
            done
          fi

      # État de la page au moment de chaque échec (instantané d'accessibilité écrit par Playwright).
      - name: Pages en échec en annotations
        if: failure()
        working-directory: frontend
        run: |
          for file in test-results/*/error-context.md; do
            [ -f "$file" ] || continue
            # Fenêtre d'erreur en premier : l'annotation est limitée à 4 096 caractères.
            dialog=$(grep -A 14 'alertdialog' "$file" | grep -v '^\s*$' | head -c 3000 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            [ -n "$dialog" ] && echo "::warning title=Fenêtre d’erreur::${dialog}"
            body=$(grep -v '^\s*$' "$file" | head -c 6000 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::warning title=$(dirname "$file" | cut -c14-80)::${body}"
          done

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-diagnostics
          path: frontend/test-results/

  frontend:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Format (Prettier)
        run: npm run format:check

      - name: Types (TypeScript)
        run: npm run typecheck

      - name: Tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build
